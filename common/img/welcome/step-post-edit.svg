<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">Group and item permissions</title>
  <desc id="desc">A two-stage view showing group members and specific permissions, followed by a post Permissions panel.</desc>
  <rect width="1400" height="950" fill="#f1f1f1"/>

  <!-- Group permissions screen -->
  <rect x="20" y="25" width="1360" height="425" rx="4" fill="#fff" stroke="#c8c9ce"/>
  <text x="40" y="53" fill="#66589a" font-family="Arial, sans-serif" font-size="14" font-weight="700">1 · Edit Permissions — VIP Group</text>
  <rect x="40" y="70" width="175" height="360" fill="#202020"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#e7e7e7"><text x="55" y="98">Dashboard</text><text x="55" y="125">Posts</text><text x="55" y="152">Media</text><text x="55" y="179">Pages</text><text x="55" y="206">Comments</text><text x="55" y="233">Appearance</text><text x="55" y="260">Plugins</text><rect x="40" y="271" width="175" height="28" fill="#3859da"/><text x="55" y="290" fill="#fff" font-weight="700">Permissions</text><text x="55" y="319">Permissions</text><rect x="40" y="327" width="175" height="28" fill="#333"/><text x="55" y="346" fill="#fff" font-weight="700">– Edit</text><text x="55" y="375">Teaser</text><text x="55" y="402">Settings</text></g>
  <rect x="228" y="70" width="1132" height="360" fill="#f6f6f6"/>
  <text x="250" y="108" fill="#172033" font-family="Arial, sans-serif" font-size="23">Edit Permissions</text>
  <rect x="1114" y="82" width="150" height="38" rx="2" fill="#66589a"/><text x="1189" y="106" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Update Permissions</text>
  <text x="250" y="145" fill="#222" font-family="Arial, sans-serif" font-size="13" font-weight="700">Name:</text><rect x="360" y="122" width="380" height="36" fill="#fff" stroke="#8d8e93"/><text x="375" y="146" fill="#444" font-family="Arial, sans-serif" font-size="13">VIP Group</text>
  <text x="250" y="198" fill="#222" font-family="Arial, sans-serif" font-size="13" font-weight="700">Description:</text><rect x="360" y="173" width="380" height="48" fill="#fff" stroke="#8d8e93"/><text x="375" y="196" fill="#444" font-family="Arial, sans-serif" font-size="12">VIP Group with more benefits</text>

  <rect x="250" y="240" width="1060" height="75" fill="#fff" stroke="#c8c9ce"/><text x="270" y="263" fill="#222" font-family="Arial, sans-serif" font-size="14" font-weight="700">Group Members</text><rect x="270" y="275" width="830" height="27" rx="3" fill="#fafafa" stroke="#b4b5ba"/><rect x="280" y="281" width="135" height="18" rx="3" fill="#e7e7e7"/><text x="289" y="294" fill="#555" font-family="Arial, sans-serif" font-size="10">× Orion Goldner</text><rect x="422" y="281" width="145" height="18" rx="3" fill="#e7e7e7"/><text x="431" y="294" fill="#555" font-family="Arial, sans-serif" font-size="10">× Mariana Quigley</text><text x="1075" y="294" fill="#777" font-family="Arial, sans-serif" font-size="13">⌕</text>

  <rect x="250" y="329" width="1060" height="82" fill="#fff" stroke="#c8c9ce"/><rect x="250" y="329" width="180" height="34" fill="#fff" stroke="#c8c9ce"/><text x="340" y="351" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Add Specific Permissions</text><rect x="430" y="329" width="130" height="34" fill="#e8e8e8" stroke="#c8c9ce"/><text x="495" y="351" fill="#777" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Add Extra Roles</text><rect x="560" y="329" width="65" height="34" fill="#e8e8e8" stroke="#c8c9ce"/><text x="592" y="351" fill="#777" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Copy</text><text x="270" y="390" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="700">Post Type</text><rect x="270" y="394" width="145" height="28" fill="#eaf2ff" stroke="#4969dd"/><text x="285" y="413" fill="#3659b8" font-family="Arial, sans-serif" font-size="11" font-weight="700">Post⌄</text><text x="435" y="413" fill="#777" font-family="Arial, sans-serif" font-size="11">Choose a post type first</text>

  <!-- transition -->
  <path d="M700 456v34" fill="none" stroke="#66589a" stroke-width="3"/><path d="M690 480l10 12 10-12" fill="none" stroke="#66589a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="476" fill="#66589a" font-family="Arial, sans-serif" font-size="12">then fine-tune one item</text>

  <!-- Post/page edit screen with the expanded metabox -->
  <rect x="20" y="510" width="1360" height="415" rx="4" fill="#fff" stroke="#c8c9ce"/>
  <text x="40" y="538" fill="#66589a" font-family="Arial, sans-serif" font-size="14" font-weight="700">2 · Edit a post or page</text>
  <rect x="40" y="555" width="190" height="350" fill="#f7f9fb" stroke="#dfe2e8"/>
  <rect x="40" y="575" width="190" height="48" fill="#fff"/><rect x="40" y="575" width="4" height="48" fill="#3859da"/><text x="83" y="604" fill="#3859da" font-family="Arial, sans-serif" font-size="13" font-weight="700">◉  View</text><text x="83" y="660" fill="#5b6f88" font-family="Arial, sans-serif" font-size="13">✎  Edit</text><text x="83" y="716" fill="#5b6f88" font-family="Arial, sans-serif" font-size="13">♟  Select as Parent</text>
  <rect x="250" y="555" width="1110" height="350" fill="#fff"/>
  <rect x="250" y="555" width="1110" height="28" fill="#fff" stroke="#c8c9ce"/><text x="268" y="574" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="700">Meta Boxes</text><text x="1320" y="574" fill="#333" font-family="Arial, sans-serif" font-size="12">⌃</text>
  <rect x="250" y="583" width="1110" height="35" fill="#fff" stroke="#c8c9ce"/><text x="268" y="606" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="700">Permissions: Post</text><text x="1320" y="606" fill="#66589a" font-family="Arial, sans-serif" font-size="13">⌃</text>
  <rect x="250" y="618" width="1110" height="287" fill="#fff" stroke="#d9dce2"/>
  <rect x="270" y="635" width="205" height="36" rx="5" fill="#f0f3f8"/><rect x="273" y="638" width="130" height="30" rx="5" fill="#fff"/><text x="288" y="658" fill="#3859da" font-family="Arial, sans-serif" font-size="12" font-weight="700">♟ Roles &amp; Groups</text><text x="421" y="658" fill="#5b6f88" font-family="Arial, sans-serif" font-size="12">♟ Users</text>
  <rect x="270" y="682" width="350" height="34" fill="#fff" stroke="#8d9bad"/><text x="286" y="704" fill="#778496" font-family="Arial, sans-serif" font-size="12">⌕  Search roles and groups...</text>
  <rect x="270" y="729" width="70" height="27" rx="14" fill="#6d6ee5"/><text x="305" y="747" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">All 12</text><rect x="348" y="729" width="78" height="27" rx="14" fill="#fff" stroke="#a46bea"/><text x="387" y="747" fill="#6d40b2" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Role 8</text><rect x="434" y="729" width="82" height="27" rx="14" fill="#fff" stroke="#e6ba62"/><text x="475" y="747" fill="#a26d20" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Group 1</text><rect x="524" y="729" width="114" height="27" rx="14" fill="#fff" stroke="#ee9c61"/><text x="581" y="747" fill="#b4632c" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Login State 3</text>
  <rect x="270" y="766" width="1050" height="31" fill="#f8fafc" stroke="#d9dce2"/><text x="286" y="786" fill="#333" font-family="Arial, sans-serif" font-size="11">□  Select All</text><text x="390" y="786" fill="#555" font-family="Arial, sans-serif" font-size="11">Bulk Actions⌄</text><rect x="510" y="772" width="58" height="21" fill="#fff" stroke="#4969dd"/><text x="539" y="786" fill="#3659b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Apply</text><text x="1260" y="786" fill="#3659b8" font-family="Arial, sans-serif" font-size="11" text-anchor="end">0 selected</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#222">
    <rect x="270" y="801" width="330" height="42" fill="#fff" stroke="#edf0f4"/><text x="286" y="819">□</text><text x="315" y="817" fill="#9b53d8" font-size="9" font-weight="700">ROLE</text><text x="315" y="834" font-weight="700">Author</text><rect x="455" y="809" width="130" height="25" rx="3" fill="#e8f5ff" stroke="#74c4f5"/><text x="466" y="825" fill="#115582" font-size="10" font-weight="700">Default access: Enabled</text>
    <rect x="610" y="801" width="330" height="42" fill="#fff" stroke="#edf0f4"/><text x="626" y="819">□</text><text x="655" y="817" fill="#9b53d8" font-size="9" font-weight="700">ROLE</text><text x="655" y="834" font-weight="700">Editor</text><rect x="795" y="809" width="130" height="25" rx="3" fill="#e8f5ff" stroke="#74c4f5"/><text x="806" y="825" fill="#115582" font-size="10" font-weight="700">Default access: Enabled</text>
    <rect x="950" y="801" width="370" height="42" fill="#fff" stroke="#edf0f4"/><text x="966" y="819">□</text><text x="995" y="817" fill="#e49a18" font-size="9" font-weight="700">GROUP</text><text x="995" y="834" font-weight="700">VIP Group</text><rect x="1150" y="809" width="150" height="25" rx="3" fill="#e8f5ff" stroke="#74c4f5"/><text x="1162" y="825" fill="#115582" font-size="10" font-weight="700">Default access</text>
    <rect x="270" y="847" width="330" height="42" fill="#fff" stroke="#edf0f4"/><text x="286" y="865">□</text><text x="315" y="863" fill="#9b53d8" font-size="9" font-weight="700">ROLE</text><text x="315" y="880" font-weight="700">Subscriber</text><rect x="455" y="855" width="130" height="25" rx="3" fill="#e8f5ff" stroke="#74c4f5"/><text x="466" y="871" fill="#115582" font-size="10" font-weight="700">Default access: Enabled</text>
    <rect x="610" y="847" width="330" height="42" fill="#fff" stroke="#edf0f4"/><text x="626" y="865">□</text><text x="655" y="863" fill="#ee9c61" font-size="9" font-weight="700">LOGIN STATE</text><text x="655" y="880" font-weight="700">Logged In</text><rect x="795" y="855" width="130" height="25" rx="3" fill="#e8f5ff" stroke="#74c4f5"/><text x="806" y="871" fill="#115582" font-size="10" font-weight="700">Default access: Enabled</text>
  </g>
</svg>
