<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Permissions General settings</title>
  <desc id="desc">The General tab showing the Post Types and Taxonomies controls.</desc>
  <rect width="1590" height="700" fill="#f1f1f1"/>

  <!-- WordPress admin sidebar: the route into Permissions settings -->
  <rect width="190" height="700" fill="#1d1d1d"/>
  <rect y="43" width="190" height="657" fill="#202020"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#e7e7e7">
    <text x="20" y="78">Dashboard</text>
    <text x="20" y="119">Posts</text>
    <text x="20" y="160">Media</text>
    <text x="20" y="201">Pages</text>
    <text x="20" y="242">Comments</text>
    <text x="20" y="283">Appearance</text>
    <text x="20" y="324">Plugins</text>
    <rect y="340" width="190" height="34" fill="#3859da"/>
    <text x="20" y="362" fill="#fff" font-weight="700">Permissions</text>
    <text x="30" y="397" fill="#cfcfcf" font-size="12">Permissions</text>
    <text x="30" y="424" fill="#cfcfcf" font-size="12">Teaser</text>
    <rect x="18" y="437" width="154" height="27" rx="2" fill="#333"/>
    <text x="30" y="455" fill="#fff" font-size="12" font-weight="700">Settings</text>
    <text x="30" y="491" fill="#cfcfcf" font-size="12">Welcome</text>
    <text x="20" y="533" fill="#f5b21b" font-size="12" font-weight="700">Upgrade to Pro</text>
    <text x="20" y="580">Tools</text>
    <text x="20" y="621">Settings</text>
  </g>

  <g transform="translate(190 0)">

  <rect width="1400" height="43" fill="#66589a"/>
  <text x="700" y="27" fill="#fff" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">You're using PublishPress Permissions Free. The Pro version has more features and support.</text>
  <rect x="1280" y="7" width="102" height="29" rx="4" fill="#ffb31a"/>
  <text x="1331" y="26" fill="#5d4300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Upgrade to Pro</text>

  <text x="20" y="82" fill="#172033" font-family="Arial, sans-serif" font-size="25">Permissions Settings</text>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="20" y="104" width="86" height="36" fill="#fff" stroke="#66589a" stroke-width="1.5"/>
    <text x="63" y="127" fill="#66589a" text-anchor="middle">General</text>
    <rect x="110" y="104" width="88" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="154" y="127" fill="#66589a" text-anchor="middle">Editing</text>
    <rect x="202" y="104" width="126" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="265" y="127" fill="#66589a" text-anchor="middle">Media Library</text>
    <rect x="332" y="104" width="104" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="384" y="127" fill="#66589a" text-anchor="middle">Features</text>
    <rect x="440" y="104" width="118" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="499" y="127" fill="#66589a" text-anchor="middle">Integrations</text>
    <rect x="562" y="104" width="95" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="609" y="127" fill="#66589a" text-anchor="middle">Advanced</text>
    <rect x="661" y="104" width="124" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="695" y="126" fill="#66589a">User Posts</text>
    <rect x="746" y="111" width="30" height="20" rx="10" fill="#7b42ed"/><text x="761" y="125" fill="#fff" font-size="10" text-anchor="middle">PRO</text>
    <rect x="789" y="104" width="133" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="826" y="126" fill="#66589a">Membership</text>
    <rect x="879" y="111" width="30" height="20" rx="10" fill="#7b42ed"/><text x="894" y="125" fill="#fff" font-size="10" text-anchor="middle">PRO</text>
    <rect x="926" y="104" width="119" height="36" fill="#dedee2" stroke="#c8c8cf"/><text x="950" y="126" fill="#66589a">File Access</text>
    <rect x="1008" y="111" width="30" height="20" rx="10" fill="#7b42ed"/><text x="1023" y="125" fill="#fff" font-size="10" text-anchor="middle">PRO</text>
  </g>

  <rect x="20" y="152" width="1126" height="450" fill="#fff" stroke="#c8c9ce"/>
  <line x1="20" y1="410" x2="1146" y2="410" stroke="#dedee2"/>
  <text x="42" y="191" fill="#222" font-family="Arial, sans-serif" font-size="16" font-weight="700">Post Types</text>
  <text x="270" y="191" fill="#3d3d42" font-family="Arial, sans-serif" font-size="15">Modify permissions for these Post Types:</text>
  <circle cx="620" cy="186" r="10" fill="#fff" stroke="#9b9da4"/><text x="620" y="190" fill="#777" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">i</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#444">
    <rect x="270" y="211" width="20" height="20" rx="2" fill="#4969dd"/><path d="M274 220l5 5 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="227">Posts</text><text x="355" y="227" fill="#7b7d84" font-size="12">⌄</text><text x="380" y="227" fill="#888" font-size="12" font-style="italic">Metabox enabled, Permissions screen enabled</text>
    <rect x="270" y="246" width="20" height="20" rx="2" fill="#4969dd"/><path d="M274 255l5 5 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="262">Pages</text><text x="355" y="262" fill="#7b7d84" font-size="12">⌄</text><text x="380" y="262" fill="#888" font-size="12" font-style="italic">Metabox enabled, Permissions screen enabled</text>
    <rect x="270" y="281" width="20" height="20" rx="2" fill="#4969dd"/><path d="M274 290l5 5 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="297">Media</text><text x="355" y="297" fill="#7b7d84" font-size="12">⌄</text><text x="380" y="297" fill="#888" font-size="12" font-style="italic">Metabox enabled, Permissions screen enabled</text>
    <rect x="270" y="316" width="20" height="20" rx="2" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="300" y="332">Nav Menus (Block)</text>
    <rect x="270" y="380" width="20" height="20" rx="2" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="300" y="396">Enforce distinct edit, delete capability requirements for Media</text><text x="270" y="422" fill="#888" font-size="13" font-style="italic">If enabled, corresponding Media edit and delete capabilities must be added to existing roles.</text>
  </g>

  <text x="42" y="444" fill="#222" font-family="Arial, sans-serif" font-size="16" font-weight="700">Taxonomies</text>
  <text x="270" y="444" fill="#3d3d42" font-family="Arial, sans-serif" font-size="15">Modify permissions for these Taxonomies:</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#444">
    <rect x="270" y="469" width="20" height="20" rx="2" fill="#4969dd"/><path d="M274 478l5 5 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="485">Categories</text>
    <rect x="270" y="504" width="20" height="20" rx="2" fill="#4969dd"/><path d="M274 513l5 5 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="520">Tags</text>
    <rect x="270" y="539" width="20" height="20" rx="2" fill="#4969dd"/><path d="M274 548l5 5 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="555">Formats</text>
  </g>

  <rect x="1170" y="152" width="210" height="235" fill="#fff" stroke="#66589a" stroke-width="1.5"/>
  <rect x="1170" y="152" width="210" height="38" fill="#66589a"/>
  <text x="1185" y="177" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Need Permissions Support?</text>
  <text x="1185" y="218" fill="#46464d" font-family="Arial, sans-serif" font-size="12">If you need help or have a new</text><text x="1185" y="235" fill="#46464d" font-family="Arial, sans-serif" font-size="12">feature request, let us know.</text>
  <text x="1185" y="268" fill="#66589a" font-family="Arial, sans-serif" font-size="12">Request Support ↗</text>
  <text x="1185" y="303" fill="#46464d" font-family="Arial, sans-serif" font-size="12">Detailed documentation is also</text><text x="1185" y="320" fill="#46464d" font-family="Arial, sans-serif" font-size="12">available on the plugin website.</text>
  <text x="1185" y="353" fill="#66589a" font-family="Arial, sans-serif" font-size="12">View Knowledge Base ↗</text>

  <rect x="20" y="625" width="101" height="32" rx="2" fill="#3659dc"/><text x="70" y="646" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Save Changes</text>
  </g>
</svg>
