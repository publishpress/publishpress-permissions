<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Create a Permission Group</title>
  <desc id="desc">A two-page flow from the User Groups list to the Add New Permission Group form.</desc>
  <rect width="1400" height="900" fill="#f1f1f1"/>

  <!-- Page 1: the reliable entry point -->
  <rect x="20" y="35" width="1360" height="375" rx="4" fill="#fff" stroke="#c8c9ce"/>
  <text x="40" y="62" fill="#66589a" font-family="Arial, sans-serif" font-size="14" font-weight="700">1 · Permissions — User Groups</text>
  <rect x="40" y="78" width="175" height="312" fill="#202020"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#e7e7e7">
    <text x="55" y="105">Dashboard</text><text x="55" y="132">Posts</text><text x="55" y="159">Media</text><text x="55" y="186">Pages</text><text x="55" y="213">Comments</text><text x="55" y="240">Appearance</text><text x="55" y="267">Plugins</text>
    <rect x="40" y="278" width="175" height="28" fill="#3859da"/><text x="55" y="297" fill="#fff" font-weight="700">Permissions</text>
    <text x="55" y="326">Permissions</text><text x="55" y="351">Teaser</text><text x="55" y="376">Settings</text>
  </g>
  <rect x="228" y="78" width="1132" height="312" fill="#f6f6f6"/>
  <text x="250" y="116" fill="#172033" font-family="Arial, sans-serif" font-size="23">Permissions</text>
  <rect x="421" y="89" width="145" height="34" rx="2" fill="#fff" stroke="#4969dd" stroke-width="1.5"/><text x="493" y="111" fill="#3659b8" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Add New Group</text>
  <rect x="250" y="139" width="124" height="34" fill="#fff" stroke="#c8c9ce"/><text x="312" y="161" fill="#66589a" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">User Groups</text>
  <rect x="378" y="139" width="64" height="34" fill="#e2e2e5" stroke="#c8c9ce"/><text x="410" y="161" fill="#66589a" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Users</text>
  <text x="250" y="198" fill="#555" font-family="Arial, sans-serif" font-size="11">Group Type: <tspan font-weight="700">All</tspan>  | WordPress Roles  | Custom Groups  | Login State</text>
  <rect x="250" y="216" width="1110" height="35" fill="#fff" stroke="#c8c9ce"/><text x="265" y="238" fill="#555" font-family="Arial, sans-serif" font-size="11">Bulk actions⌄</text><rect x="355" y="222" width="58" height="23" fill="#fff" stroke="#4969dd"/><text x="384" y="238" fill="#3659b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Apply</text><rect x="1080" y="222" width="170" height="23" fill="#fff" stroke="#aaa"/><rect x="1260" y="222" width="90" height="23" fill="#fff" stroke="#4969dd"/><text x="1305" y="238" fill="#3659b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Search Groups</text>
  <rect x="250" y="263" width="1110" height="127" fill="#fff" stroke="#c8c9ce"/>
  <rect x="250" y="263" width="1110" height="28" fill="#f8f8f8"/><text x="265" y="282" fill="#5d5e64" font-family="Arial, sans-serif" font-size="10" font-weight="700">□</text><text x="300" y="282" fill="#5d5e64" font-family="Arial, sans-serif" font-size="10" font-weight="700">Name</text><text x="470" y="282" fill="#5d5e64" font-family="Arial, sans-serif" font-size="10" font-weight="700">Type</text><text x="640" y="282" fill="#5d5e64" font-family="Arial, sans-serif" font-size="10" font-weight="700">Users</text><text x="750" y="282" fill="#5d5e64" font-family="Arial, sans-serif" font-size="10" font-weight="700">Specific Permissions</text><text x="1090" y="282" fill="#5d5e64" font-family="Arial, sans-serif" font-size="10" font-weight="700">Description</text>
  <g font-family="Arial, sans-serif" font-size="10"><rect x="250" y="291" width="1110" height="25" fill="#f7f8f8"/><text x="300" y="308" fill="#66589a" font-weight="700">Author</text><text x="470" y="308" fill="#555">WordPress Role</text><text x="642" y="308" fill="#555">10</text><text x="750" y="308" fill="#66589a">View Post (26)</text><text x="1090" y="308" fill="#555">All users with the WordPress role of Author</text><text x="300" y="333" fill="#66589a" font-weight="700">Contributor</text><text x="470" y="333" fill="#555">WordPress Role</text><text x="642" y="333" fill="#555">11</text><text x="1090" y="333" fill="#555">All users with the WordPress role of Contributor</text><rect x="250" y="341" width="1110" height="25" fill="#f7f8f8"/><text x="300" y="358" fill="#66589a" font-weight="700">Customer</text><text x="470" y="358" fill="#555">WordPress Role</text><text x="642" y="358" fill="#555">10</text></g>

  <!-- transition -->
  <path d="M700 419v37" fill="none" stroke="#66589a" stroke-width="3"/><path d="M690 447l10 12 10-12" fill="none" stroke="#66589a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="444" fill="#66589a" font-family="Arial, sans-serif" font-size="12">opens the form</text>

  <!-- Page 2: the form reached by Add New Group -->
  <rect x="20" y="478" width="1360" height="380" rx="4" fill="#fff" stroke="#c8c9ce"/>
  <text x="40" y="505" fill="#66589a" font-family="Arial, sans-serif" font-size="14" font-weight="700">2 · Create New Permission Group</text>
  <rect x="40" y="520" width="175" height="317" fill="#202020"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#e7e7e7"><text x="55" y="547">Dashboard</text><text x="55" y="574">Posts</text><text x="55" y="601">Media</text><text x="55" y="628">Pages</text><text x="55" y="655">Comments</text><text x="55" y="682">Appearance</text><text x="55" y="709">Plugins</text><rect x="40" y="720" width="175" height="28" fill="#3859da"/><text x="55" y="739" fill="#fff" font-weight="700">Permissions</text><text x="55" y="768">– Add New</text><text x="55" y="795">Teaser</text><text x="55" y="822">Settings</text></g>
  <rect x="228" y="520" width="1132" height="317" fill="#f6f6f6"/>
  <text x="250" y="558" fill="#172033" font-family="Arial, sans-serif" font-size="23">Create New Permission Group</text>
  <text x="250" y="607" fill="#222" font-family="Arial, sans-serif" font-size="14" font-weight="700">Name</text><rect x="420" y="581" width="820" height="38" fill="#fff" stroke="#8d8e93"/>
  <text x="250" y="673" fill="#222" font-family="Arial, sans-serif" font-size="14" font-weight="700">Description</text><rect x="420" y="647" width="820" height="38" fill="#fff" stroke="#8d8e93"/>
  <text x="250" y="730" fill="#555" font-family="Arial, sans-serif" font-size="11">Note: Groups are a more flexible alternative to user roles. You can create groups of users and give or deny them access to areas of your site.</text>
  <rect x="250" y="757" width="122" height="36" rx="2" fill="#3659dc"/><text x="311" y="780" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Create Group</text>
</svg>
