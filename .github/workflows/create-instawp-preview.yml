name: Create InstaWP Preview

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: "Slack user ID who requested the preview"
        required: true
        type: string

      slack_channel:
        description: "Slack channel ID to notify"
        required: true
        type: string

      repository:
        description: "Repository key from Slack Worker"
        required: true
        type: string

      target_ref:
        description: "Branch name or Pull Request number"
        required: true
        type: string

      run_tests:
        description: "Run Ghost Inspector tests"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

      tmate_enabled:
        description: 'Enable "tmate" for debugging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: instawp-preview-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PLUGIN_SLUG: press-permit-core
  BUILD_DIR: dist/press-permit-core
  PACKAGE_DIR: package
  PACKAGE_FILE: press-permit-core-preview.zip

  LOCAL_SYNC_ROOT: instawp-upload
  LOCAL_SYNC_WP_CONTENT: instawp-upload/wp-content
  LOCAL_UPLOAD_DIR: instawp-upload/wp-content/uploads/deploypress-preview
  REMOTE_UPLOAD_DIR: wp-content/uploads/deploypress-preview

jobs:
  create-preview:
    name: Build package and create InstaWP preview
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate required secrets and inputs
        env:
          INSTAWP_TOKEN: ${{ secrets.INSTAWP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -Eeuo pipefail

          test -n "$INSTAWP_TOKEN" || { echo "Missing INSTAWP_TOKEN"; exit 1; }
          test -n "$SLACK_BOT_TOKEN" || { echo "Missing SLACK_BOT_TOKEN"; exit 1; }
          test -n "$REQUESTED_BY" || { echo "Missing requested_by input"; exit 1; }
          test -n "$SLACK_CHANNEL" || { echo "Missing slack_channel input"; exit 1; }
          test -n "$TARGET_REF" || { echo "Missing target_ref input"; exit 1; }

      - name: Install Linux packages
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zip rsync

      - name: Setup tmate session for debugging
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.tmate_enabled }}
        timeout-minutes: 10
        with:
          detached: true

      - name: Resolve branch or PR
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const input = '${{ inputs.target_ref }}'.trim();

            if (/^\d+$/.test(input)) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(input)
              });

              core.setOutput('type', 'pull_request');
              core.setOutput('label', `PR #${input}`);
              core.setOutput('checkout_ref', pr.data.head.sha);
              core.setOutput('source_branch', pr.data.head.ref);
              core.setOutput('source_sha', pr.data.head.sha);
            } else {
              core.setOutput('type', 'branch');
              core.setOutput('label', input);
              core.setOutput('checkout_ref', input);
              core.setOutput('source_branch', input);
              core.setOutput('source_sha', '');
            }

      - name: Checkout selected branch or PR
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}

      - name: Create .env file
        run: |
          set -Eeuo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/.env.example" ]; then
            echo ".env.example not found"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/.env.example" "$GITHUB_WORKSPACE/.env"

      - name: Fix script permissions
        run: |
          set -Eeuo pipefail

          chmod +x "$GITHUB_WORKSPACE/dev-workspace/run"

          if compgen -G "$GITHUB_WORKSPACE/dev-workspace/scripts/*.sh" > /dev/null; then
            chmod +x "$GITHUB_WORKSPACE/dev-workspace/scripts/"*.sh
          fi

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Prepare Composer
        run: |
          set -Eeuo pipefail

          "$GITHUB_WORKSPACE/dev-workspace/run" composer validate
          "$GITHUB_WORKSPACE/dev-workspace/run" composer install --prefer-dist --no-interaction --no-progress

      - name: Show tool versions
        run: |
          set -Eeuo pipefail

          "$GITHUB_WORKSPACE/dev-workspace/run" composer info:versions

      - name: Run lint check
        run: |
          set -Eeuo pipefail

          "$GITHUB_WORKSPACE/dev-workspace/run" composer check:lint

      - name: Build plugin package
        run: |
          set -Eeuo pipefail

          "$GITHUB_WORKSPACE/dev-workspace/run" composer build

      - name: Verify build output
        run: |
          set -Eeuo pipefail

          if [ ! -d "$GITHUB_WORKSPACE/${BUILD_DIR}" ]; then
            echo "Build directory not found: $GITHUB_WORKSPACE/${BUILD_DIR}"
            echo "Available dist files:"
            find "$GITHUB_WORKSPACE/dist" -maxdepth 3 \( -type f -o -type d \) -print || true
            exit 1
          fi

          echo "Build output found:"
          ls -la "$GITHUB_WORKSPACE/${BUILD_DIR}"

      - name: Create plugin ZIP for InstaWP
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/${PACKAGE_DIR}"

          cd "$GITHUB_WORKSPACE/dist"

          if [ ! -d "$PLUGIN_SLUG" ]; then
            echo "Expected plugin directory not found: $GITHUB_WORKSPACE/dist/${PLUGIN_SLUG}"
            ls -la "$GITHUB_WORKSPACE/dist"
            exit 1
          fi

          zip -r "$GITHUB_WORKSPACE/${PACKAGE_DIR}/${PACKAGE_FILE}" "${PLUGIN_SLUG}"

          echo "Created package:"
          ls -lh "$GITHUB_WORKSPACE/${PACKAGE_DIR}/${PACKAGE_FILE}"

          echo "Package checksum:"
          sha256sum "$GITHUB_WORKSPACE/${PACKAGE_DIR}/${PACKAGE_FILE}"

      - name: Upload package as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-package-${{ github.run_id }}
          path: ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install InstaWP CLI
        run: |
          set -Eeuo pipefail

          npm install -g @instawp/cli@beta

          echo "InstaWP CLI version:"
          instawp --version || true

          echo "InstaWP sync help:"
          instawp sync push --help || true

      - name: Create InstaWP preview site
        id: instawp
        env:
          INSTAWP_TOKEN: ${{ secrets.INSTAWP_TOKEN }}
        run: |
          set -Eeuo pipefail

          REPO_NAME="${{ github.event.repository.name }}"

          case "${REPO_NAME}" in
            publishpress-authors)
              REPO_SHORT="authors"
              ;;
            publishpress-authors-pro)
              REPO_SHORT="authors-pro"
              ;;
            publishpress-blocks)
              REPO_SHORT="blocks"
              ;;
            publishpress-blocks-pro)
              REPO_SHORT="blocks-pro"
              ;;
            publishpress-capabilities)
              REPO_SHORT="capabilities"
              ;;
            publishpress-capabilities-pro)
              REPO_SHORT="caps-pro"
              ;;
            publishpress-cart)
              REPO_SHORT="cart"
              ;;
            publishpress-cart-pro)
              REPO_SHORT="cart-pro"
              ;;
            publishpress-checklists)
              REPO_SHORT="checklists"
              ;;
            publishpress-checklists-pro)
              REPO_SHORT="checks-pro"
              ;;
            publishpress-future)
              REPO_SHORT="future"
              ;;
            publishpress-future-pro)
              REPO_SHORT="future-pro"
              ;;
            publishpress-hub)
              REPO_SHORT="hub"
              ;;
            publishpress-permissions)
              REPO_SHORT="permissions"
              ;;
            publishpress-permissions-pro)
              REPO_SHORT="perms-pro"
              ;;
            publishpress-planner)
              REPO_SHORT="planner"
              ;;
            publishpress-planner-pro)
              REPO_SHORT="planner-pro"
              ;;
            publishpress-revisions)
              REPO_SHORT="revisions"
              ;;
            publishpress-revisions-pro)
              REPO_SHORT="revs-pro"
              ;;
            publishpress-shortlinks)
              REPO_SHORT="shortlinks"
              ;;
            publishpress-shortlinks-pro)
              REPO_SHORT="links-pro"
              ;;
            publishpress-statuses)
              REPO_SHORT="statuses"
              ;;
            publishpress-statuses-pro)
              REPO_SHORT="status-pro"
              ;;
            *)
              REPO_SHORT=$(echo "${REPO_NAME}" | sed 's/^publishpress-//' | cut -c1-12)
              ;;
          esac

          RUN_SHORT=$(echo "${{ github.run_id }}" | tail -c 7)

          if [ -n "${{ steps.resolve.outputs.source_sha }}" ]; then
            SHA_SHORT=$(echo "${{ steps.resolve.outputs.source_sha }}" | cut -c1-7)
          else
            SHA_SHORT=$(git rev-parse --short=7 HEAD)
          fi

          SITE_NAME="${REPO_SHORT}-${RUN_SHORT}-${SHA_SHORT}"

          if [ ${#SITE_NAME} -gt 30 ]; then
            MAX_REPO_LENGTH=$((30 - 1 - ${#RUN_SHORT} - 1 - ${#SHA_SHORT}))
            REPO_SHORT=$(echo "${REPO_SHORT}" | cut -c1-${MAX_REPO_LENGTH})
            SITE_NAME="${REPO_SHORT}-${RUN_SHORT}-${SHA_SHORT}"
          fi

          echo "Creating InstaWP site: ${SITE_NAME}"
          echo "Site name length: ${#SITE_NAME}"

          instawp create --name "${SITE_NAME}" --temporary --json > instawp-site.json

          echo "Raw InstaWP response:"
          cat instawp-site.json

          SITE_ID=$(jq -r '.data.id // .id // .site.id // .site_id // empty' instawp-site.json)
          SITE_URL=$(jq -r '.data.wp_url // .data.url // .url // .site.url // .wp_url // .site_url // empty' instawp-site.json)

          if [ -z "$SITE_ID" ]; then
            echo "Could not detect InstaWP site ID from response."
            cat instawp-site.json
            exit 1
          fi

          if [ -z "$SITE_URL" ]; then
            echo "Could not detect InstaWP site URL from response."
            cat instawp-site.json
            exit 1
          fi

          {
            echo "site_id=${SITE_ID}"
            echo "site_url=${SITE_URL}"
            echo "site_name=${SITE_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Created InstaWP site:"
          echo "Name: ${SITE_NAME}"
          echo "ID: ${SITE_ID}"
          echo "URL: ${SITE_URL}"

      - name: Prepare minimal package sync directory
        run: |
          set -Eeuo pipefail

          PACKAGE_PATH="$GITHUB_WORKSPACE/${PACKAGE_DIR}/${PACKAGE_FILE}"
          LOCAL_UPLOAD_PATH="$GITHUB_WORKSPACE/${LOCAL_UPLOAD_DIR}"

          echo "Checking local package..."
          test -f "$PACKAGE_PATH"
          ls -lh "$PACKAGE_PATH"
          sha256sum "$PACKAGE_PATH"

          echo "Preparing minimal sync root..."
          rm -rf "$GITHUB_WORKSPACE/${LOCAL_SYNC_ROOT}"
          mkdir -p "$LOCAL_UPLOAD_PATH"

          cp "$PACKAGE_PATH" "$LOCAL_UPLOAD_PATH/${PACKAGE_FILE}"

          echo "Prepared files for InstaWP sync:"
          find "$GITHUB_WORKSPACE/${LOCAL_SYNC_ROOT}" -type f -print
          ls -lh "$LOCAL_UPLOAD_PATH"

      - name: Upload package to InstaWP site
        env:
          INSTAWP_TOKEN: ${{ secrets.INSTAWP_TOKEN }}
        run: |
          set -Eeuo pipefail

          SITE_ID="${{ steps.instawp.outputs.site_id }}"

          echo "Creating remote upload directory..."
          instawp exec "${SITE_ID}" mkdir -p "${REMOTE_UPLOAD_DIR}" --api

          echo "Dry-run sync to InstaWP site..."
          instawp sync push "${SITE_ID}" \
            --path "$GITHUB_WORKSPACE/${LOCAL_SYNC_WP_CONTENT}/" \
            --dry-run

          echo "Syncing minimal wp-content directory to InstaWP site..."
          instawp sync push "${SITE_ID}" \
            --path "$GITHUB_WORKSPACE/${LOCAL_SYNC_WP_CONTENT}/"

          echo "Checking remote upload directory..."
          instawp exec "${SITE_ID}" ls -lah "${REMOTE_UPLOAD_DIR}" --api

      - name: Install and activate package on InstaWP
        env:
          INSTAWP_TOKEN: ${{ secrets.INSTAWP_TOKEN }}
        run: |
          set -Eeuo pipefail

          SITE_ID="${{ steps.instawp.outputs.site_id }}"
          REMOTE_PACKAGE="${REMOTE_UPLOAD_DIR}/${PACKAGE_FILE}"

          echo "Checking package exists on InstaWP site..."
          instawp exec "${SITE_ID}" test -f "${REMOTE_PACKAGE}" --api

          echo "Installing plugin ZIP on InstaWP site..."
          instawp wp "${SITE_ID}" -- plugin install "${REMOTE_PACKAGE}" --force --activate --api

          echo "Installed plugin status:"
          instawp wp "${SITE_ID}" -- plugin list --api

      - name: Run Ghost Inspector tests
        id: ghost
        if: ${{ inputs.run_tests == 'yes' }}
        env:
          GHOST_INSPECTOR_API_KEY: ${{ secrets.GHOST_INSPECTOR_API_KEY }}
          GHOST_INSPECTOR_SUITE_ID: ${{ secrets.GHOST_INSPECTOR_SUITE_ID }}
          SITE_URL: ${{ steps.instawp.outputs.site_url }}
        run: |
          set -Eeuo pipefail

          if [ -z "${GHOST_INSPECTOR_API_KEY}" ] || [ -z "${GHOST_INSPECTOR_SUITE_ID}" ]; then
            echo "Ghost Inspector secrets are missing. Skipping tests."
            echo "result_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Triggering Ghost Inspector tests for ${SITE_URL}"

          curl -fsS \
            "https://api.ghostinspector.com/v1/suites/${GHOST_INSPECTOR_SUITE_ID}/execute/" \
            --get \
            --data-urlencode "apiKey=${GHOST_INSPECTOR_API_KEY}" \
            --data-urlencode "startUrl=${SITE_URL}" \
            > ghost-response.json

          cat ghost-response.json

          RESULT_URL=$(jq -r '.data.results[0].urls.html // .data.url // .url // empty' ghost-response.json)

          echo "result_url=${RESULT_URL}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack success
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          SITE_URL: ${{ steps.instawp.outputs.site_url }}
          SITE_NAME: ${{ steps.instawp.outputs.site_name }}
          GHOST_RESULT_URL: ${{ steps.ghost.outputs.result_url }}
        run: |
          set -Eeuo pipefail

          MESSAGE="✅ InstaWP preview site is ready.

          Repository: *${{ github.event.repository.name }}*
          Requested by: <@${{ inputs.requested_by }}>
          Ref: *${{ steps.resolve.outputs.label }}*
          Site name: *${SITE_NAME}*
          Site: ${SITE_URL}
          GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "${GHOST_RESULT_URL}" ]; then
            MESSAGE="${MESSAGE}

          Ghost Inspector: ${GHOST_RESULT_URL}"
          fi

          jq -n \
            --arg channel "${SLACK_CHANNEL}" \
            --arg text "${MESSAGE}" \
            '{channel: $channel, text: $text}' \
            > slack-payload.json

          curl -fsS -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @slack-payload.json

      - name: Notify Slack failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          SITE_URL: ${{ steps.instawp.outputs.site_url }}
          SITE_NAME: ${{ steps.instawp.outputs.site_name }}
        run: |
          set -Eeuo pipefail

          MESSAGE="❌ InstaWP preview creation failed.

          Repository: *${{ github.event.repository.name }}*
          Requested by: <@${{ inputs.requested_by }}>
          Requested ref: *${{ inputs.target_ref }}*
          Resolved ref: *${{ steps.resolve.outputs.label }}*
          Site name: ${SITE_NAME}
          Site: ${SITE_URL}
          GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg channel "${SLACK_CHANNEL}" \
            --arg text "${MESSAGE}" \
            '{channel: $channel, text: $text}' \
            > slack-payload.json

          curl -fsS -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @slack-payload.json
