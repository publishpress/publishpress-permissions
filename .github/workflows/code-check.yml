name: Code checks
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'

  pull_request:
    branches:
      - '*'

  workflow_call:

  workflow_dispatch:

jobs:
  check:
    name: Check the code
    uses: publishpress/github-workflows/.github/workflows/code-standards.yml@v3

  welcome-tests:
    name: Welcome regressions (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check post-type choices and save handler
        run: |
          php tests/unit/welcome-post-types.php
          php tests/unit/welcome-save.php
          php tests/unit/minimum-version-bootstrap.php
          php tests/unit/minimum-version-bootstrap.php 5.4
      - name: Check nested exception post IDs
        run: php tests/unit/exception-post-ids.php

  select2-tests:
    name: Select2 modern jQuery compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/select2-tests" --no-save --ignore-scripts jquery@3.7.1 jsdom@26.1.0
      - name: Check all distributed Select2 bundles
        run: NODE_PATH="$RUNNER_TEMP/select2-tests/node_modules" node tests/unit/select2-native.js

  unsupported-php-bootstrap:
    name: Reject unsupported PHP before loading dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Check the real entry point on unsupported PHP
        run: php tests/unit/minimum-version-bootstrap.php
